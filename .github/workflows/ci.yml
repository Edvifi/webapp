name: CI

# Cloudflare Pages deploys main automatically, so this is the only gate between
# a merge and eight real students. It must run on the PR *and* on main, because
# a merge commit can break what neither branch did alone.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The suite needs these because web/src/lib/fafsaData.ts reads them at
      # import time, so a missing value fails collection rather than a test.
      # They are build-time public values, not secrets: the anon key is
      # row-level-security scoped and already ships in the client bundle.
      # Set them as repository variables so CI matches the deployed build.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  edge-functions:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # These run on Deno, not Node, so the web job above never sees them.
      - name: Check ingest-scholarships
        run: deno check --config supabase/functions/ingest-scholarships/deno.json supabase/functions/ingest-scholarships/index.ts

      - name: Check deadline-digest
        run: deno check --config supabase/functions/deadline-digest/deno.json supabase/functions/deadline-digest/index.ts

      # Deletes a student's account for good. A type error here is the kind
      # that half-deletes someone.
      - name: Check delete-account
        run: deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts

  deploy-edge-functions:
    name: Deploy edge functions
    # Only on main, and only after the typecheck above passed. A PR must never
    # deploy: these functions hold the service-role key and run against the one
    # production database.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: edge-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploys every function under supabase/functions, reading verify_jwt
      # from supabase/config.toml. Functions deployed to the project but absent
      # from this repo are left alone.
      #
      # If SUPABASE_ACCESS_TOKEN is missing this fails, and that is the point:
      # before this job existed, edge functions only reached production when
      # somebody remembered to push them by hand, and the digest spent weeks
      # running against code nobody had deployed. A red build is the cheapest
      # version of finding that out.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref oybmtfnarflrceukvays
